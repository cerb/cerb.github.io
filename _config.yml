# Site settings
title: "Cerb"
company: "Webgroup Media, LLC."
copyright: 2002-2025
version: 2025032101
email: team@cerb.ai
description: Cerb automates helpdesk inboxes and workflows. Boost team productivity with interactive agents, personalized dashboards, and endless API integrations.
url: "https://cerb.ai"
baseurl: ""
logo_url: /assets/cerb_logo.svg
social_image_url: /assets/images/cerb-social.png
search_endpoint_url: https://api.cerb.cloud/docs/search
timezone: America/Los_Angeles
encoding: UTF-8

exclude:
  - .idea
  - .github
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
keep_files: [assets]

# Blog
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: ""

# Atom feed
feed:
  disable_in_development: true

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/
  guides:
    output: true
    sort_by: title
    permalink: /guides/:path/
  packages:
    output: true
    sort_by: title
    permalink: /packages/:path/
  releases:
    output: true
    permalink: /releases/:path/
  solutions:
    output: true
    sort_by: path
    permalink: /solutions/:path/
  tips:
    output: true
    sort_by: title
    permalink: /tips/:path/
  workflows:
    output: true
    sort_by: title
    permalink: /workflows/:path/

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  auto_ids: true
  parse_block_html: false
  input: GFM
  syntax_highlighter: rouge
  smart_quotes: apos,apos,quot,quot
plugins:
  - jekyll-redirect-from
  - jekyll-tabs

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"
      jumbotron:
        title: Documentation
  -
    scope:
      path: ""
      type: "guides"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "packages"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "posts"
      jumbotron:
        title: Blog
        tagline: Release announcements, helpful tips, and community discussion
  -
    scope:
      path: ""
      type: "releases"
    values:
      layout: "releases"
      jumbotron:
        title: Release History
        breadcrumbs:
          -
            label: Releases &raquo;
            url: /docs/history/
  -
    scope:
      path: ""
      type: "solutions"
    values:
      layout: "solution"
  -
    scope:
      path: ""
      type: "tips"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "workflows"
    values:
      layout: "integration"
