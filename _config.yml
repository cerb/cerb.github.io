# Site settings
title: "Cerb"
company: "Webgroup Media, LLC."
copyright: 2002-2024
version: 2024100801
email: team@cerb.ai
description: Cerb is a fully customizable web-based platform for team email and workflow automation. Boost team productivity with bots, dashboards, and shared inboxes.
url: "https://cerb.ai"
baseurl: ""
logo_url: /assets/cerb_logo.svg
social_image_url: /assets/images/cerb-social.png
search_endpoint_url: https://api.cerb.cloud/docs/search
mastodon_username: "@cerb.social"
github_username:  cerb
timezone: America/Los_Angeles
encoding: UTF-8

exclude: [.idea, node_modules, README.md, Dockerfile, docker-compose.yml, Gemfile, Gemfile.lock]
keep_files: [assets]

# Blog
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: ""

# Atom feed
feed:
  disable_in_development: true

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/
  guides:
    output: true
    sort_by: title
    permalink: /guides/:path/
  packages:
    output: true
    sort_by: title
    permalink: /packages/:path/
  releases:
    output: true
    permalink: /releases/:path/
  tips:
    output: true
    sort_by: title
    permalink: /tips/:path/
  workflows:
    output: true
    sort_by: title
    permalink: /workflows/:path/

# Build settings
markdown: kramdown
kramdown:
  auto_ids: true
  parse_block_html: false
plugins:
  - jekyll-redirect-from

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"
      jumbotron:
        title: Documentation
  -
    scope:
      path: ""
      type: "guides"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "packages"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "posts"
      jumbotron:
        title: Blog
        tagline: Release announcements, helpful tips, and community discussion
  -
    scope:
      path: ""
      type: "releases"
    values:
      layout: "releases"
      jumbotron:
        title: Release History
        breadcrumbs:
          -
            label: Releases &raquo;
            url: /docs/history/
  -
    scope:
      path: ""
      type: "tips"
    values:
      layout: "integration"
  -
    scope:
      path: ""
      type: "workflows"
    values:
      layout: "integration"
