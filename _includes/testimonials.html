<div style="padding:10px;display:none;">
	<div class="grid feature">
		<div id="cerb-testimonials" style="color:rgb(182,182,182);">
			<div class="cerb-testimonial">
				<div style="font-size:0.9em;padding:0 1em;min-width:335px;">
					<q class="cerb-testimonial-quote">{{ testimonial.quote }}</q>
					<div>
						- <b class="cerb-testimonial-author"></b>
						<span class="client-logo" style="display:none;"></span>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function() {
	try {
		let $testimonial_container = document.querySelector('#cerb-testimonials .cerb-testimonial');
		let $client_logo = $testimonial_container.querySelector('.client-logo');

		let testimonials = [
			{% for testimonial in site.data.testimonials %}
			{
				"client": {{testimonial.client|jsonify}},
				"quote": {{testimonial.quote|normalize_whitespace|jsonify}},
				"author": {{testimonial.author|jsonify}}
			},
			{% endfor %}
		];

		let showRandomTestimonial = function() {
			let len = testimonials.length;
			let r = Math.floor(Math.random()*len);
			$testimonial_container.querySelector('.cerb-testimonial-quote').innerHTML = testimonials[r]['quote'];
			$testimonial_container.querySelector('.cerb-testimonial-author').innerHTML = testimonials[r]['author'];
			$client_logo.className = '';
			$client_logo.classList.add('client-logo', 'client-' + testimonials[r]['client']);
			$testimonial_container.parentElement.parentElement.parentElement.style.display = 'block';
		};

		showRandomTestimonial();

		//setInterval(showRandomTestimonial, 30000);
	} catch(e) {}
});
</script>
