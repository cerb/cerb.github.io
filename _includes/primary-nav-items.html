{% assign page_path = page.url|downcase|remove_first:'/'|split:'/' %}
<ul>
	{% if page.url != '/' %}
	<li class="{% if page.url == '/' %}current{% endif %}">
		<a href="/">Home</a>
	</li>
	{% endif %}
	<li class="{% if page_path[0] == 'features' %}current{% endif %}">
		<a href="/features/">Features</a>
	</li>
	<li class="{% if page_path[0] == 'pricing' %}current{% endif %}">
		<a href="/pricing/">Pricing</a>
	</li>
	<li class="{% if page_path[0] == 'resources' or (page_path[0] == 'docs' and page_path[1] != 'history') or page_path[0] == 'guides' or page_path[0] == 'packages' %}current{% endif %}">
		<a href="/resources/">Docs</a>
	</li>
	<li class="{% if page_path[0] == 'docs' and page_path[1] == 'history' %}current{% endif %}">
		<a href="/docs/history/">Releases</a>
	</li>
	<li class="{% if page_path[0] == 'clients' %}current{% endif %}">
		<a href="/clients/">Testimonials</a>
	</li>
	<li class="{% if page_path[0] == 'help' %}current{% endif %}">
		<a href="/help/">Help</a>
	</li>
</ul>

<form action="/search/" method="GET" class="nav-search">
	<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
	<input type="search" name="q" placeholder="Search docs..." autocomplete="off" spellcheck="false">
</form>
